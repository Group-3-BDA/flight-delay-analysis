name: Flight Delay CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Flight Delay Pipeline
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    ############################################################
    # Create Bronze Dependency ZIP
    ############################################################

    - name: Create Bronze Dependency ZIP
      run: |
        cd glue/bronze_to_silver
        zip -r dependencies.zip \
          config.py \
          utils.py

    ############################################################
    # Create Silver Dependency ZIP
    ############################################################

    - name: Create Silver Dependency ZIP
      run: |
        cd glue/silver_to_gold
        zip -r silver_to_gold_lib.zip \
          config.py \
          constants.py \
          dimensions.py \
          ml_dataset.py \
          spark_setup.py \
          transformations.py \
          validation.py \
          visualization.py \
          writers.py

    ############################################################
    # Upload Bronze Files
    ############################################################

    - name: Upload Bronze Scripts to S3
      run: |
        aws s3 sync glue/bronze_to_silver \
        s3://flight-delay-scripts/glue/bronze_to_silver \
        --delete

    ############################################################
    # Upload Silver Files
    ############################################################

    - name: Upload Silver Scripts to S3
      run: |
        aws s3 sync glue/silver_to_gold \
        s3://flight-delay-scripts/glue/silver_to_gold \
        --delete

    ############################################################
    # Terraform
    ############################################################

    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    - name: Terraform Format Check
      working-directory: terraform
      run: terraform fmt -check

    - name: Terraform Validate
      working-directory: terraform
      run: terraform validate

    - name: Terraform Plan
      working-directory: terraform
      run: terraform plan

    - name: Terraform Apply
      working-directory: terraform
      run: terraform apply -auto-approve

    ############################################################
    # Trigger Glue Workflow
    ############################################################

    - name: Trigger Glue Workflow
      run: |
        aws glue start-workflow-run \
          --name flight-delay-workflow
