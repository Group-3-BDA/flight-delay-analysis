name: Flight Delay CI/CD Pipeline

on:
  workflow_dispatch:

concurrency:
  group: flight-delay-pipeline
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Flight Delay Pipeline
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    ############################################################
    # Create Bronze Dependency ZIP
    ############################################################

    - name: Create Bronze Dependency ZIP
      run: |
        cd glue/bronze_to_silver
        zip -r dependencies.zip \
          config.py \
          utils.py

    ############################################################
    # Create Silver Dependency ZIP
    ############################################################

    - name: Create Silver Dependency ZIP
      run: |
        cd glue/silver_to_gold
        zip -r silver_to_gold_lib.zip \
          config.py \
          constants.py \
          dimensions.py \
          ml_dataset.py \
          spark_setup.py \
          transformations.py \
          validation.py \
          visualization.py \
          writers.py

    ############################################################
    # Upload Bronze Files
    ############################################################

    - name: Upload Bronze Scripts to S3
      run: |
        aws s3 sync glue/bronze_to_silver \
        s3://${{ secrets.S3_BUCKET_NAME }}/glue/bronze_to_silver \
        --delete

    ############################################################
    # Upload Silver Files
    ############################################################

    - name: Upload Silver Scripts to S3
      run: |
        aws s3 sync glue/silver_to_gold \
        s3://${{ secrets.S3_BUCKET_NAME }}/glue/silver_to_gold \
        --delete

    ############################################################
    # Terraform
    ############################################################

    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    - name: Terraform Format Check
      working-directory: terraform
      run: terraform fmt -check

    - name: Terraform Validate
      working-directory: terraform
      run: terraform validate

    - name: Terraform Plan
      working-directory: terraform
      run: terraform plan -out=tfplan

    - name: Terraform Apply
      working-directory: terraform
      run: terraform apply -auto-approve tfplan

    ############################################################
    # Trigger Glue Workflow
    ############################################################

    - name: Trigger Glue Workflow
      run: |
        echo "Starting Glue Workflow..."
        aws glue start-workflow-run \
          --name flight-delay-workflow

    ############################################################
    # Wait for Bronze Job
    ############################################################

    - name: Wait for Bronze Job
      run: |
        echo "Waiting for Bronze Job..."

        while true
        do
          STATUS=$(aws glue get-job-runs \
            --job-name bronze-to-silver-glue-test \
            --max-results 1 \
            --query "JobRuns[0].JobRunState" \
            --output text)

          echo "Bronze Job Status: $STATUS"

          if [ "$STATUS" = "SUCCEEDED" ]; then
            echo "Bronze Job completed successfully."
            break
          fi

          if [ "$STATUS" = "FAILED" ] || \
             [ "$STATUS" = "TIMEOUT" ] || \
             [ "$STATUS" = "STOPPED" ]; then
            echo "Bronze Job failed."
            exit 1
          fi

          sleep 30
        done

    ############################################################
    # Wait for Silver Job
    ############################################################

    - name: Wait for Silver Job
      run: |
        echo "Waiting for Silver Job..."

        while true
        do
          STATUS=$(aws glue get-job-runs \
            --job-name Silver_to_Gold_test \
            --max-results 1 \
            --query "JobRuns[0].JobRunState" \
            --output text)

          echo "Silver Job Status: $STATUS"

          if [ "$STATUS" = "SUCCEEDED" ]; then
            echo "Silver Job completed successfully."
            break
          fi

          if [ "$STATUS" = "FAILED" ] || \
             [ "$STATUS" = "TIMEOUT" ] || \
             [ "$STATUS" = "STOPPED" ]; then
            echo "Silver Job failed."
            exit 1
          fi

          sleep 30
        done

    ############################################################
    # Verify Gold Output
    ############################################################

    - name: Verify Gold Output
      run: |
        echo "Checking Gold Bucket..."

        FILE_COUNT=$(aws s3 ls s3://gold-demo12/Gold_Glue_Test/ --recursive | wc -l)

        echo "Files Found: $FILE_COUNT"

        if [ "$FILE_COUNT" -eq 0 ]; then
          echo "Gold bucket is empty!"
          exit 1
        fi

        echo "Gold bucket verification successful."

    ############################################################
    # Deployment Complete
    ############################################################

    - name: Deployment Complete
      run: |
        echo "======================================"
        echo "Flight Delay ETL Pipeline Completed!"
        echo "======================================"
